<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa de Usuário</title>
</head>

<body>

  <header>
    <h1>Formulário de Pesquisa</h1>
  </header>

  <main>
    <form action="#" method="POST">

      <div>
        <label for="nome-completo">Nome Completo:</label>
        <input type="text" id="nome-completo" name="nome-completo" required>

        <label for="emaildousuario">E-mail:</label>
        <input type="email" id="emaildousuario" name="emaildousuario" required>
      </div>

      <div>
        <label for="navegador">Qual é o seu navegador de internet favorito?</label>
        <select id="navegador" name="navegador">
          <option value="chrome">Chrome</option>
          <option value="firefox">Firefox</option>
          <option value="edge">Edge</option>
          <option value="brave">Brave</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div>
        <label for="pet">Você tem um bichinho de estimação?</label>
        <input type="checkbox" id="pet" name="pet">
      </div>

      <div>
        <label for="feedback">Liste os lugares onde você morou.</label>
        <textarea id="feedback" name="feedback" rows="4"
          placeholder="Stillwater Flórida, Amsterdã Holanda, Timbuktu Mali"></textarea>
      </div>

      <div>
        <button type="submit">Enviar Enquete</button>
      </div>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 - Formulário HTML | Thaélly Holanda da Silva Lima</p>
  </footer>

</body>

</html>
